name: Build Showcase RPX (Homebrew)

# Builds the three MuffinEMU showcase roms with the devkitPro Wii U toolchain, the same
# way build-rainbow-rpx.yml builds rainbow.rpx: homebrew RPX carries no encryption, so
# this is a plain Linux container with no relation to the Xcode build and no console
# keys anywhere in it.
#
# A matrix rather than three workflows. Each rom is one .c plus the shared header, and
# the wut sample Makefile builds whatever .c files are in source/ - so each matrix leg
# stages exactly one of them.

on:
  workflow_dispatch: {}

jobs:
  build-showcase:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    strategy:
      fail-fast: false
      # Serial, not parallel. Three legs starting at once each ran `dkp-pacman -Sy`
      # against pkg.devkitpro.org and one of them got back HTTP 403 - their server
      # throttling us, correctly. Three jobs is not worth hammering somebody else's
      # package mirror for; the whole matrix takes about a minute either way.
      max-parallel: 1
      matrix:
        demo: [prime, bakery, handson]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install wut (Wii U userland toolchain)
        run: dkp-pacman -Sy --noconfirm wut

      - name: Clone wut (for its sample Makefile)
        run: git clone --depth 1 https://github.com/devkitPro/wut.git /tmp/wut

      # POSIX sh, not bash - the devkitPPC container ships no bash and Actions falls
      # back to `sh -e {0}`, which is dash and has no pipefail.
      # The project directory must NOT be called "build". The wut Makefile decides
      # whether it is the outer invocation or the recursive inner one by comparing its
      # own BUILD variable ("build") against $(notdir $(CURDIR)) - so a project at
      # /tmp/build convinces it that it is ALREADY inside the build directory, it takes
      # the inner branch, finds no objects, and reports "Nothing to be done for 'all'"
      # while exiting 0. That is what the first attempt at this workflow did, and the
      # only reason build-rainbow-rpx.yml never hit it is that it happens to use
      # /tmp/rainbow.
      - name: Assemble the project
        run: |
          set -eu
          PROJ=/tmp/rom-${{ matrix.demo }}
          cp -r /tmp/wut/samples/make/helloworld "$PROJ"
          rm -f "$PROJ"/source/*.c "$PROJ"/source/*.cpp
          cp homebrew/showcase/source/muffin_gfx.h "$PROJ"/source/
          cp homebrew/showcase/source/${{ matrix.demo }}.c "$PROJ"/source/
          ls -la "$PROJ"/source

      - name: Build ${{ matrix.demo }}.rpx
        run: |
          set -eu
          PROJ=/tmp/rom-${{ matrix.demo }}
          make -C "$PROJ" TARGET=${{ matrix.demo }}
          # make can report "Nothing to be done" and still exit 0, so the artifact
          # existing is the only real proof the build happened.
          test -f "$PROJ"/${{ matrix.demo }}.rpx

      # Same check as the rainbow workflow, for the same reason: this repo has shipped
      # a truncated RPX before, and failing here is free.
      - name: Verify the built RPX
        run: |
          set -eu
          RPX=/tmp/rom-${{ matrix.demo }}/${{ matrix.demo }}.rpx
          SIZE=$(stat -c%s "$RPX")
          echo "${{ matrix.demo }}.rpx = $SIZE bytes"
          test "$SIZE" -gt 4096
          head -c 4 "$RPX" | od -An -tx1 | tr -d ' \n' | grep -qi '^7f454c46'
          echo "verify: PASS"

      - name: Upload ${{ matrix.demo }}.rpx
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ matrix.demo }}
          path: /tmp/rom-${{ matrix.demo }}/${{ matrix.demo }}.rpx
          retention-days: 30
